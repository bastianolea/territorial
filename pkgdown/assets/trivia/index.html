<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivia territorial de Chile</title>
  <!-- GitHub Pages no envía los headers COOP/COEP: este service worker los agrega,
       necesarios para que menu() pueda esperar la respuesta del usuario en webR -->
  <script src="coi-serviceworker.js"></script>
  <style>
    :root { --fg: #5c534a; --bg: #f9f1e5; --primary: #7CB096; --accent: #E1B280; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header { background: var(--accent); padding: 0.8rem 1.2rem; }
    header h1 { margin: 0; font-size: 1.2rem; }
    header a { color: var(--fg); }
    main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 900px; margin: 0 auto; padding: 1rem; }
    #out {
      flex: 1; margin: 0; padding: 1rem; min-height: 60vh; max-height: 75vh; overflow-y: auto;
      background: #fffaf2; border: 2px solid var(--accent); border-radius: 8px;
      white-space: pre-wrap; word-wrap: break-word; font-size: 1rem; line-height: 1.4;
    }
    .err { color: #b3423a; }
    form { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    input, button { font: inherit; padding: 0.5rem 0.8rem; border-radius: 6px; border: 2px solid var(--primary); }
    input { flex: 1; background: #fff; color: var(--fg); }
    button { background: var(--primary); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    footer { text-align: center; font-size: 0.8rem; padding: 0.6rem; }
    footer a { color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <h1>Trivia de comunas y regiones de Chile, con el paquete
      <a href="https://bastianolea.github.io/territorial/">{territorial}</a></h1>
  </header>
  <main>
    <p id="aviso" class="err" hidden></p>
    <pre id="out" aria-live="polite">Cargando R en tu navegador (puede tardar unos segundos)...
</pre>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Escribe el número de tu respuesta y presiona Enter" aria-label="Respuesta" disabled>
      <button type="submit" id="send" disabled>Enviar</button>
      <button type="button" id="again" disabled>Jugar de nuevo</button>
    </form>
  </main>
  <footer>
    R funciona en tu navegador gracias a <a href="https://docs.r-wasm.org/webr/latest/">webR</a>.<br>
    Instala el paquete: <code>install.packages("territorial", repos = "https://bastianolea.r-universe.dev")</code>
  </footer>

  <script type="module">
    import { Console } from "https://webr.r-wasm.org/latest/webr.mjs";

    const out = document.getElementById("out");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const again = document.getElementById("again");
    const ansi = /\x1b\[[0-9;]*[A-Za-z]/g;
    let started = false;
    let ready = false;

    const write = (text, cls) => {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = text.replace(ansi, "");
      out.append(span);
      out.scrollTop = out.scrollHeight;
    };

    if (!window.crossOriginIsolated) {
      // en la primera visita coi-serviceworker recarga la página para activar el
      // aislamiento: esperar antes de avisar o de iniciar webR
      await new Promise((resolve) => setTimeout(resolve, 4000));
      const aviso = document.getElementById("aviso");
      aviso.textContent = "Aviso: la página no está aislada (cross-origin isolation), " +
        "así que las preguntas podrían no aceptar respuestas. Prueba recargando la página " +
        "o usando otro navegador (no funciona en ventanas privadas de algunos navegadores).";
      aviso.hidden = false;
    }

    const con = new Console({
      stdout: (line) => {
        // ocultar el mensaje de bienvenida de R hasta que el paquete esté cargado
        if (!ready) {
          if (line === "__TRIVIA_LISTA__") { ready = true; out.textContent = ""; }
          return;
        }
        write(line + "\n");
      },
      stderr: (line) => write(line + "\n", "err"),
      prompt: (p) => {
        const rPrompt = p === "> " || p === "+ ";
        if (rPrompt) {
          // R volvió al prompt normal: la trivia terminó (o aún está cargando)
          input.disabled = send.disabled = true;
          again.disabled = !started;
        } else {
          // prompt de menu() ("Selection: "): esperar la respuesta
          started = true;
          write(p);
          input.disabled = send.disabled = false;
          again.disabled = true;
          input.focus();
        }
      },
    });
    con.run();

    const sendLine = (text, echo = true) => {
      if (echo) write(text + "\n");
      con.stdin(text);
    };

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      sendLine(input.value);
      input.value = "";
    });

    again.addEventListener("click", () => {
      out.textContent = "";
      again.disabled = true;
      sendLine("territorial::trivia()", false);
    });

    sendLine(
      'invisible({' +
      'options(cli.num_colors = 1); ' +
      'webr::install("territorial", repos = c("https://bastianolea.r-universe.dev", "https://repo.r-wasm.org"), quiet = TRUE); ' +
      'suppressPackageStartupMessages(library(territorial)); ' +
      'cat("__TRIVIA_LISTA__\\n"); ' +
      'cat("Listo! Responde cada pregunta con el número de la alternativa.\\n\\n"); ' +
      'trivia()' +
      '})',
      false
    );
  </script>
</body>
</html>
